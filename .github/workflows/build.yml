name: Build unsigned IPA

# Builds an unsigned Blink.ipa for sideloading (SideStore / LiveContainer re-sign it).
# Adapted from diasbaskara/blink's workflow. Runs on manual dispatch, or on a push to raw.

on:
  workflow_dispatch:
  push:
    branches: [raw]
    paths-ignore: ['**.md']

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: select newest Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: show toolchain
      run: |
        xcodebuild -version
        xcodebuild -showsdks | grep -i ios

    - name: use cache
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          xcfs/.build
          Frameworks/ios_system/xcfs/.build
        key: ${{ runner.os }}-${{ hashFiles('get_frameworks.sh', 'xcfs/Package.swift') }}

    - name: get frameworks
      if: steps.cache.outputs.cache-hit != 'true'
      run: ./get_frameworks.sh

    - name: get resources
      run: ./get_resources.sh

    - name: copy xcconfig
      run: cp template_setup.xcconfig developer_setup.xcconfig

    - name: strip entitlements a free Apple ID cannot sign
      run: |
        for ENT_FILE in Blink/Blink.entitlements BlinkFileProviderExtension/BlinkFileProviderExtension.entitlements; do
          [ -f "$ENT_FILE" ] || continue
          for key in \
            com.apple.developer.associated-domains \
            com.apple.developer.default-data-protection \
            com.apple.developer.icloud-container-identifiers \
            com.apple.developer.icloud-services \
            com.apple.developer.ubiquity-container-identifiers \
            com.apple.developer.ubiquity-kvstore-identifier \
            com.apple.developer.user-fonts \
            com.apple.developer.web-browser \
            com.apple.security.app-sandbox \
            com.apple.security.device.bluetooth \
            com.apple.security.device.camera \
            com.apple.security.files.user-selected.read-write \
            com.apple.security.network.client \
            com.apple.security.network.server \
            com.apple.security.personal-information.location; do
            /usr/libexec/PlistBuddy -c "Delete :$key" "$ENT_FILE" 2>/dev/null || true
          done
          echo "== $ENT_FILE" && /usr/libexec/PlistBuddy -c "Print" "$ENT_FILE"
        done

    - name: build unsigned app
      run: |
        set -o pipefail
        xcodebuild \
          -project Blink.xcodeproj \
          -scheme Blink \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath ./DerivedData \
          CODE_SIGN_IDENTITY='' \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO \
          build 2>&1 | tee build.log | grep -E '(error|warning: .*deprecated)|BUILD (SUCCEEDED|FAILED)' || true
        grep -q 'BUILD SUCCEEDED' build.log

    - name: package ipa
      id: pkg
      run: |
        APP_PATH=$(find ./DerivedData/Build/Products -name "Blink.app" -type d | head -1)
        echo "app: $APP_PATH"
        # App extensions need extra App IDs a free account rarely has room for.
        rm -rf "$APP_PATH/PlugIns"
        find "$APP_PATH" \( -name "*.debug.dylib" -o -name "__preview.dylib" \) -delete
        mkdir Payload && cp -R "$APP_PATH" Payload/
        zip -qry Blink.ipa Payload
        VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PATH/Info.plist")
        BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP_PATH/Info.plist")
        echo "tag=v${VER}-${BUILD}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shasum -a 256 Blink.ipa | tee Blink.ipa.sha256

    - name: upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    - name: publish release
      uses: softprops/action-gh-release@v2
      with:
        name: Blink ${{ steps.pkg.outputs.tag }}
        tag_name: ${{ steps.pkg.outputs.tag }}
        target_commitish: ${{ github.sha }}
        files: |
          Blink.ipa
          Blink.ipa.sha256
        prerelease: true
